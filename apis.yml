name: Binpress
description: >-
  Binpress was a marketplace for commercial source code and open-source
  software components, founded in 2011 in Israel by Adam Benayoun (CEO) and
  Eran Galperin (CTO) and backed by 500 Startups (500 Global). The platform let
  developers publish, discover, buy, and sell SDKs, libraries, and code
  components on a 70/30 revenue split, growing to roughly 1,000 listings with
  GitHub integration and later adding hosted storefronts for digital goods. The
  company was acquired by CodersClan in 2016 and no longer operates as an active
  developer platform; the binpress.com domain has since been repurposed as an
  unrelated digital-business content site with no public API. This profile
  originated as a 500 Global portfolio lead surfaced into the API Evangelist
  network for enrichment.
